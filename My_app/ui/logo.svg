<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 370 250" width="370" height="250">
  <title>PhaseMark</title>
  <rect width="370" height="250" fill="#ffffff"/>

  <!-- Letra M -->
  <path fill="#1B2B50" d="M162 232 V18 H212 L257 120 L302 18 H352 V232 H302 V130 L267 209 H247 L212 130 V232 Z"/>

  <!-- Letra P: white outline first, fill on top (paint-order="stroke",
       written out because wx.svg / nanosvg ignores paint-order) -->
