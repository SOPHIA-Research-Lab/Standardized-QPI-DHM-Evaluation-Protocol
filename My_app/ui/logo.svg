  <path fill="#1B2B50" d="M18 18 H112 A80 80 0 0 1 112 178 H62 V232 H18 Z"/>

  <!-- Mira (círculos) -->
  <circle cx="100" cy="98" r="62" fill="#ffffff"/>
  <circle cx="100" cy="98" r="52" fill="#1B2B50"/>
  <circle cx="100" cy="98" r="36" fill="#ffffff"/>
  <circle cx="100" cy="98" r="26" fill="#1B2B50"/>

  <!-- Mira (líneas) -->
  <g stroke="#ffffff" stroke-width="6" stroke-linecap="butt">
    <line x1="10" y1="98" x2="192" y2="98"/>
    <line x1="100" y1="6" x2="100" y2="186"/>
  </g>

  <!-- Centro rojo -->
  <circle cx="100" cy="98" r="15" fill="#D83A2E"/>
</svg>
